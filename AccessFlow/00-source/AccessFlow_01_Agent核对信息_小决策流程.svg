系统管理 → 不直接照搬</text><text x="78" y="778" class="small">✓ 权限规则：识别审批、范围限制、许可证等执行条件</text><text x="78" y="802" class="small">✓ 关键缺失：无</text><text x="78" y="826" class="small">✓ 规则冲突：无</text><text x="78" y="850" class="small">→ 决策：信息足够，可直接生成开通方案</text><rect x="875" y="690" width="815" height="180" rx="14" fill="#FFF7ED" stroke="#D97706"/><text x="900" y="720" class="section">什么情况下才问经理？</text><text x="900" y="752" class="small">• 用户输入与 HR 记录冲突，并且会改变入职时间 / 权限方案</text><text x="900" y="779" class="small">• 无法确认员工身份或项目参与关系</text><text x="900" y="806" class="small">• 缺失信息无法从现有系统补齐，且会影响权限范围 / 审批路径</text><text x="900" y="833" class="small">• 与方案无关的信息缺失 → 不询问，继续</text></svg>