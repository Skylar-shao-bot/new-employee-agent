<text x="46" y="46" class="title">01｜Agent 核对信息 · 小决策流程</text><text x="46" y="70" class="subtitle">目标：把经理的自然语言需求转换成“已核验上下文”，只有关键缺失 / 冲突无法自动解决时才询问</text><rect x="46" y="88" width="135" height="28" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/><circle cx="61" cy="102" r="4.5" fill="#2563EB"/><text x="74" y="106" class="small">人工</text><rect x="194" y="88" width="135" height="28" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/><circle cx="209" cy="102" r="4.5" fill="#7C3AED"/><text x="222" y="106" class="small">Agent / 大模型</text><rect x="342" y="88" width="135" height="28" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/><circle cx="357" cy="102" r="4.5" fill="#059669"/><text x="370" y="106" class="small">数据库 / 系统</text><rect x="490" y="88" width="135" height="28" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/><circle cx="505" cy="102" r="4.5" fill="#64748B"/><text x="518" y="106" class="small">结果 / 状态</text><rect x="55" y="165" width="170" height="58" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text x="140.0" y="198.0" text-anchor="middle" class="label">经理输入自然语言需求</text><rect x="270" y="165" width="185" height="58" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/><text x="362.5" y="198.0" text-anchor="middle" class="label">意图理解</text><rect x="500" y="165" width="205" height="58" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/><text x="602.5" y="198.0" text-anchor="middle" class="label">提取关键实体与约束</text><rect x="750" y="165" width="190" height="58" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/><text x="845.0" y="198.0" text-anchor="middle" class="label">检索并交叉核对</text><polygon points="1055,146.5 1145.0,194 1055,241.5 965.0,194" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/><text x="1055" y="189" text-anchor="middle" class="label">存在关键缺失</text><text x="1055" y="207" text-anchor="middle" class="label">或冲突？</text><polygon points="1260,267.5 1350.0,315 1260,362.5 1170.0,315" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/><text x="1260" y="310" text-anchor="middle" class="label">Agent 能否</text><text x="1260" y="328" text-anchor="middle" class="label">自动解决？</text><polygon points="1480,382.5 1575.0,430 1480,477.5 1385.0,430" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/><text x="1480" y="425" text-anchor="middle" class="label">是否影响</text><text x="1480" y="443" text-anchor="middle" class="label">方案生成？</text><rect x="1260" y="165" width="190" height="58" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.7"/><text x="1355.0" y="198.0" text-anchor="middle" class="label">形成已核验上下文</text><rect x="1515" y="165" width="200" height="58" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/><text x="1615.0" y="198.0" text-anchor="middle" class="label">进入“生成开通方案”</text><rect x="1510" y="540" width="200" height="58" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text x="1610.0" y="573.0" text-anchor="middle" class="label">最小化询问经理</text><rect x="1260" y="540" width="190" height="58" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/><text x="1355.0" y="573.0" text-anchor="middle" class="label">自动补齐 / 修正</text><line x1="225" y1="194" x2="270" y2="194" stroke="#98A2B3" stroke-width="1.7" marker-end="url(#arrow)"/><line x1="455" y1="194" x2="500" y2="194" stroke="#98A2B3" stroke-width="1.7" marker-end="url(#arrow)"/><line x1="705" y1="194" x2="750" y2="194" stroke="#98A2B3" stroke-width="1.7" marker-end="url(#arrow)"/><line x1="940" y1="194" x2="965" y2="194" stroke="#98A2B3" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1145,194 1180,194 1180,194 1260,194" fill="none" stroke="#98A2B3" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1180" y="186" text-anchor="middle" class="edge">否</text><line x1="1450" y1="194" x2="1515" y2="194" stroke="#98A2B3" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1055,242 1055,315 1170,315" fill="none" stroke="#98A2B3" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1055" y="307" text-anchor="middle" class="edge">是</text><polyline points="1350,315 1385,315 1385,569 1260,569" fill="none" stroke="#98A2B3" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1385" y="561" text-anchor="middle" class="edge">能</text><polyline points="1260,362 1260,430 1385,430" fill="none" stroke="#98A2B3" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1260" y="422" text-anchor="middle" class="edge">不能</text><polyline points="1575,430 1608,430 1608,569 1510,569" fill="none" stroke="#98A2B3" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1608" y="561" text-anchor="middle" class="edge">影响</text><polyline points="1480,478 1480,505 1360,505 1360,194 1260,194" fill="none" stroke="#98A2B3" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1360" y="497" text-anchor="middle" class="edge">不影响</text><polyline points="1510,569 1465,569 1465,645 1055,645 1055,242" fill="none" stroke="#98A2B3" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1465" y="637" text-anchor="middle" class="edge">获得答案后重新核对</text><path d="M530,330 C530,320 680,320 680,330 L680,372 C680,382 530,382 530,372 Z" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><ellipse cx="605.0" cy="330" rx="75.0" ry="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="605.0" y="356.0" text-anchor="middle" class="small">人事系统</text><path d="M720,330 C720,320 870,320 870,330 L870,372 C870,382 720,382 720,372 Z" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><ellipse cx="795.0" cy="330" rx="75.0" ry="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="795.0" y="356.0" text-anchor="middle" class="small">岗位模板</text><path d="M910,330 C910,320 1095,320 1095,330 L1095,372 C1095,382 910,382 910,372 Z" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><ellipse cx="1002.5" cy="330" rx="92.5" ry="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="1002.5" y="356.0" text-anchor="middle" 